<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AuraChat — Erstelle deinen eigenen persönlichen Mitarbeiter</title>
  <meta name="description" content="Er begrüsst deine Besucher, beantwortet ihre Fragen und führt sie zum richtigen Angebot. Rund um die Uhr, auf jeder Unterseite. Er lernt alles selbst von deiner Webseite." />
  <meta name="theme-color" content="#000000" />
  <meta property="og:title" content="AuraChat — Erstelle deinen eigenen persönlichen Mitarbeiter" />
  <meta property="og:description" content="Er lernt alles selbst von deiner Webseite. Du musst nichts vorbereiten." />
  <meta property="og:type" content="website" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400;14..32,500;14..32,600;14..32,700&display=swap" rel="stylesheet" />
  <style>
    /* ──────────────────────────────────────────────────────────────────────
       AuraChat — Startseite

       Bewusst EINE Welt: Schwarz. Kein Hell-Modus, weil die Gestaltung sich
       auf schwarzen Grund festlegt und ein invertierter Zwilling die Wirkung
       zerstoeren wuerde. Das ist eine Entscheidung, keine Auslassung.

       Typografie: eine einzige Grotesk in drei Groessen. Die Wirkung kommt
       aus dem Groessensprung zwischen Titel und Rest, nicht aus Schmuck.
       ────────────────────────────────────────────────────────────────────── */
    :root {
      --schwarz: #000000;
      --weiss: #ffffff;
      --grau-text: #9b9b9b;      /* Unterzeile */
      --grau-platzhalter: #7a7a7a;
      --feld: #1c1c1c;           /* Eingabe-Pille */
      --feld-rand: #2a2a2a;
      --nav-linie: rgba(255,255,255,0.08);
      --sans: "Inter", -apple-system, "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { -webkit-text-size-adjust: 100%; }
    body {
      background: var(--schwarz); color: var(--weiss);
      font-family: var(--sans); font-size: 16px; line-height: 1.5;
      -webkit-font-smoothing: antialiased; -moz-osx-font-smoothing: grayscale;
      min-height: 100dvh;
      /* Feiner Lichtschein hinter dem Titel. Sehr zurueckhaltend: Er soll den
         Text vom Grund abheben, nicht als Effekt auffallen. */
      background-image: radial-gradient(60% 42% at 50% 26%, rgba(255,255,255,0.055) 0%, rgba(255,255,255,0) 72%);
      background-repeat: no-repeat;
    }
    :focus-visible { outline: 2px solid var(--weiss); outline-offset: 3px; border-radius: 4px; }

    /* ── Kopfzeile ────────────────────────────────────────────────────── */
    .kopf {
      position: fixed; inset: 0 0 auto 0; z-index: 50;
      display: flex; align-items: center; justify-content: space-between;
      gap: 1rem; padding: 1.1rem clamp(1.25rem, 4vw, 3rem);
      transition: background-color .25s ease, border-color .25s ease, backdrop-filter .25s ease;
      border-bottom: 1px solid transparent;
    }
    .kopf[data-gescrollt="ja"] {
      background: rgba(0,0,0,0.72); backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px); border-bottom-color: var(--nav-linie);
    }
    .logo {
      display: inline-flex; align-items: center; gap: .55rem;
      font-size: 1.02rem; font-weight: 600; letter-spacing: -.02em;
      color: var(--weiss); text-decoration: none; flex: none;
    }
    .logo .zeichen {
      width: 22px; height: 22px; border-radius: 6px; background: var(--weiss);
      position: relative; flex: none;
    }
    .logo .zeichen::after {
      content: ""; position: absolute; inset: 6px auto auto 6px;
      width: 5px; height: 5px; border-radius: 50%; background: var(--schwarz);
    }

    .nav { display: flex; align-items: center; gap: clamp(1.1rem, 2.4vw, 2rem); }
    .nav a {
      color: rgba(255,255,255,0.68); text-decoration: none;
      font-size: .93rem; font-weight: 450; transition: color .18s ease;
    }
    .nav a:hover { color: var(--weiss); }
    .kopf-rechts { display: flex; align-items: center; gap: 1rem; flex: none; }
    .anmelden {
      color: rgba(255,255,255,0.68); text-decoration: none;
      font-size: .93rem; font-weight: 450; transition: color .18s ease;
    }
    .anmelden:hover { color: var(--weiss); }
    @media (max-width: 820px) { .nav { display: none; } }

    /* ── Hero ─────────────────────────────────────────────────────────── */
    .hero {
      min-height: 100dvh;
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      text-align: center;
      padding: 8rem clamp(1.25rem, 5vw, 3rem) 5rem;
    }

    /* Der Titel traegt die Seite. Zwei Zeilen auf Desktop, per <br> gesetzt,
       damit der Umbruch dort sitzt, wo er gestaltet wurde. Unter 700 px wird
       der <br> ausgeblendet und der Satz bricht natuerlich um. */
    h1 {
      font-size: clamp(2.6rem, 7.4vw, 6.4rem);
      font-weight: 600;
      line-height: 0.98;
      letter-spacing: -0.035em;
      /* 26ch statt eines knapperen Werts: Die laengere der beiden Zeilen
         ("persönlichen Mitarbeiter.") hat 25 Zeichen. Bei 16ch brach sie
         gemessen auf eine dritte Zeile um und der gesetzte Umbruch war hin.
         Kein text-wrap: balance, weil der Umbruch per <br> gesetzt ist und
         balance ihn nur wieder verschieben wuerde. */
      max-width: 26ch;
      margin-bottom: clamp(1.4rem, 2.6vw, 2.1rem);
    }
    @media (max-width: 700px) { h1 br { display: none; } h1 { max-width: 15ch; } }

    .unterzeile {
      color: var(--grau-text);
      font-size: clamp(1rem, 1.15vw, 1.12rem);
      line-height: 1.6;
      max-width: 46ch;
      margin-bottom: clamp(2rem, 3.4vw, 2.8rem);
      text-wrap: pretty;
    }

    /* ── Eingabe-Pille ────────────────────────────────────────────────── */
    .warteliste { width: min(100%, 30rem); }
    .pille {
      display: flex; align-items: center; gap: .5rem;
      background: var(--feld); border: 1px solid var(--feld-rand);
      border-radius: 999px; padding: .42rem .42rem .42rem 1.35rem;
      transition: border-color .18s ease, background-color .18s ease;
    }
    .pille:focus-within { border-color: rgba(255,255,255,0.35); background: #202020; }
    .pille input {
      flex: 1; min-width: 0; background: none; border: 0; outline: none;
      color: var(--weiss); font-family: inherit; font-size: .98rem; padding: .55rem 0;
    }
    .pille input::placeholder { color: var(--grau-platzhalter); }
    .pille button {
      flex: none; border: 0; cursor: pointer;
      background: var(--weiss); color: var(--schwarz);
      font-family: inherit; font-size: .76rem; font-weight: 700;
      letter-spacing: .06em; text-transform: uppercase;
      padding: .82rem 1.35rem; border-radius: 999px;
      transition: transform .12s ease, opacity .18s ease;
    }
    .pille button:hover { opacity: .88; }
    .pille button:active { transform: translateY(1px); }
    .pille button:disabled { opacity: .55; cursor: default; transform: none; }

    /* Rueckmeldung unter der Pille. Reserviert Platz, damit beim Einblenden
       nichts springt. */
    .meldung {
      min-height: 1.4rem; margin-top: .85rem;
      font-size: .88rem; color: var(--grau-text);
    }
    .meldung[data-art="fehler"] { color: #ff8f6b; }
    .meldung[data-art="erfolg"] { color: var(--weiss); }

    @media (max-width: 460px) {
      .pille { flex-direction: column; align-items: stretch; gap: .55rem;
               border-radius: 22px; padding: .9rem; }
      .pille input { padding: .3rem .4rem; text-align: center; }
      .pille button { width: 100%; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { transition-duration: .01ms !important; animation-duration: .01ms !important; }
    }
  </style>
</head>
<body>

  <header class="kopf" id="kopf">
    <a class="logo" href="/start.html">
      <span class="zeichen" aria-hidden="true"></span>AuraChat
    </a>

    <nav class="nav" aria-label="Hauptnavigation">
      <a href="#funktionen">Funktionen</a>
      <a href="#preis">Preis</a>
      <a href="#ueber">Über uns</a>
    </nav>

    <div class="kopf-rechts">
      <a class="anmelden" href="dashboard.html">Anmelden</a>
    </div>
  </header>

  <main class="hero">
    <h1>Erstelle deinen eigenen<br>persönlichen Mitarbeiter.</h1>

    <p class="unterzeile">
      Er begrüsst deine Besucher, beantwortet ihre Fragen und führt sie zum
      richtigen Angebot. Rund um die Uhr, auf jeder Unterseite. Er lernt alles
      selbst von deiner Webseite, du musst nichts vorbereiten.
    </p>

    <form class="warteliste" id="wartelisteForm" novalidate>
      <div class="pille">
        <label for="email" class="visually-hidden" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap;">E-Mail-Adresse</label>
        <input type="email" id="email" name="email" placeholder="Deine E-Mail-Adresse"
               autocomplete="email" required />
        <button type="submit" id="eintragen">Auf die Warteliste</button>
      </div>
      <p class="meldung" id="meldung" role="status" aria-live="polite"></p>
    </form>
  </main>

<script>
  // Kopfzeile bekommt ab 24 px Scrollhoehe einen Grund, damit der Titel
  // beim Durchscrollen nicht mit den Navigationslinks verschmilzt.
  (function () {
    const kopf = document.getElementById("kopf");
    const pruefe = () => kopf.setAttribute("data-gescrollt", window.scrollY > 24 ? "ja" : "nein");
    pruefe();
    window.addEventListener("scroll", pruefe, { passive: true });
  })();

  // Warteliste. Die Adresse wird bewusst NICHT an einen erfundenen Endpunkt
  // geschickt: Es gibt noch keinen. Bis der Empfaenger steht, prueft das
  // Formular nur die Eingabe und sagt ehrlich, was passiert.
  // Zum Anschliessen: unten die Stelle ENDPUNKT ersetzen.
  (function () {
    const form = document.getElementById("wartelisteForm");
    const feld = document.getElementById("email");
    const knopf = document.getElementById("eintragen");
    const meldung = document.getElementById("meldung");
    const ENDPUNKT = ""; // z.B. "/.netlify/functions/warteliste"

    const sage = (text, art) => {
      meldung.textContent = text;
      if (art) meldung.setAttribute("data-art", art); else meldung.removeAttribute("data-art");
    };

    form.addEventListener("submit", async (e) => {
      e.preventDefault();
      const adresse = feld.value.trim();

      // Bewusst eine schlichte Pruefung: Wer eine Adresse mit Punkt nach dem @
      // eintippt, soll durchkommen. Strengere Muster weisen echte Adressen ab.
      if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(adresse)) {
        sage("Bitte gib eine gültige E-Mail-Adresse ein.", "fehler");
        feld.focus();
        return;
      }

      if (!ENDPUNKT) {
        sage("Die Warteliste ist noch nicht angeschlossen. Deine Adresse wurde nicht gespeichert.", "fehler");
        return;
      }

      knopf.disabled = true;
      sage("Wird eingetragen …");
      try {
        const res = await fetch(ENDPUNKT, {
          method: "POST",
          headers: { "content-type": "application/json" },
          body: JSON.stringify({ email: adresse }),
        });
        if (!res.ok) throw new Error("HTTP " + res.status);
        form.reset();
        sage("Danke, du stehst auf der Liste. Wir melden uns.", "erfolg");
      } catch (err) {
        sage("Das hat nicht geklappt. Versuch es später noch einmal.", "fehler");
      } finally {
        knopf.disabled = false;
      }
    });

    // Fehlermeldung verschwindet, sobald wieder getippt wird.
    feld.addEventListener("input", () => {
      if (meldung.getAttribute("data-art") === "fehler") sage("");
    });
  })();
</script>

</body>
</html>
