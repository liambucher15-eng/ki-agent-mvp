<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Chat</title>
  <style>
    /* ══ Modern-Premium (Milestone 9) ═══════════════════════════════════════
       Alle Töne werden per color-mix AUS der Markenfarbe --farbe abgeleitet,
       damit das Widget in jeder Firmenfarbe stimmig aussieht. Kein externer
       Font, keine Lib — reines CSS (das Widget lädt in fremden Seiten). */
    :root {
      --farbe: #3f7d5a; --akzent: #a8d5b9;
      --tint:  color-mix(in srgb, var(--farbe) 7%, #ffffff);
      --tint2: color-mix(in srgb, var(--farbe) 4%, #ffffff);
      --linie: color-mix(in srgb, var(--farbe) 14%, #e8eaed);
      --farbe-dunkel: color-mix(in srgb, var(--farbe) 82%, #000);
      --schrift: 0.9rem;
    }
    * { box-sizing: border-box; }
    /* overflow:hidden hier: Diese Seite hat genau EINEN Ort zum Scrollen
       (#chat). Ohne das kann der Rest (html/body) selbst minimal überlaufen
       (Rundungsfehler, lange Inhalte auf dem Handy) — und genau dahin
       "kettet" der Browser den Scroll weiter, sobald #chat am Anschlag ist.
       Bei einem eingebetteten Chat (dieses Dokument sitzt im iframe des
       Widgets auf einer fremden Seite) reicht diese Kette sonst bis zur
       Kundenseite durch: man scrollt im Verlauf nach unten, kommt am Ende an,
       scrollt weiter — und plötzlich bewegt sich die Seite dahinter. */
    html, body { height: 100%; margin: 0; overflow: hidden; overscroll-behavior: contain; }
    body {
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
      display: flex; flex-direction: column; color: #0f172a;
      /* weicher Verlauf aus der Markenfarbe */
      background:
        radial-gradient(130% 90% at 100% 0%, var(--tint), transparent 55%),
        linear-gradient(180deg, var(--tint2), #f7f8fa);
    }

    /* --- Sidebar-Layout: runder Charakter mittig oben, Chat darunter, Eingabe
       unten. Gleiches Layout auf Desktop UND Handy. --- */
    /* Kleine schwebende Knöpfe oben rechts (Stimme + Schliessen). */
    #topbar { display: flex; justify-content: flex-end; gap: 0.4rem; padding: 0.55rem 0.6rem 0; flex-shrink: 0; }
    .rund-btn { background: rgba(255,255,255,0.7); border: 1px solid var(--linie); color: #64748b; cursor: pointer;
                width: 32px; height: 32px; border-radius: 50%; display: grid; place-items: center; padding: 0;
                -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px);
                transition: background 0.2s, color 0.2s, transform 0.2s; }
    .rund-btn:hover { color: var(--farbe); background: #fff; }
    .rund-btn svg { width: 17px; height: 17px; display: block; }
    #schliessen { font-size: 1.2rem; line-height: 1; }
    /* Erst sichtbar, wenn das Widget die Steuerung angeboten hat. Auf schmalen
       BILDSCHIRMEN gar nicht: Dort füllt der Chat ohnehin alles, links oder
       rechts andocken hätte nichts zu andocken.
       KEINE Media-Query dafür: Die misst dieses Fenster, und das ist als
       angedockter Chat immer schmal (440px) — auch auf einem grossen Monitor.
       Wie breit der Bildschirm wirklich ist, weiss nur das Widget draussen; es
       schickt es mit. */
    .nur-fenster { display: none; }
    body.fenster-steuerbar .nur-fenster { display: grid; }
    body.fenster-schmal .nur-fenster { display: none; }
    #schliessen:hover { transform: rotate(90deg); }
    /* Vorlesen sitzt nicht mehr hier oben, sondern als Pille in der Eingabe-Karte. */

    /* Charakter-Bühne: die Figur steht FREI (kein harter Kreis) auf einem weichen,
       aus --farbe abgeleiteten Schein. Der Orb bringt seinen eigenen Kreis mit. */
    /* --figur steuert die Groesse der Figur an EINER Stelle: Bild, Notfall-
       Initial und der Schein darunter haengen daran. Die Figur soll dominieren,
       man soll das Gefuehl haben, jemandem gegenueberzustehen. Die vw/vh-Anteile
       sind Deckel fuer schmale bzw. flache Fenster (Handy, kurze Viewports),
       damit die Figur nie den Chat erdrueckt. */
    #held { --figur: min(360px, 72vw, 44vh);
            flex-shrink: 0; display: flex; flex-direction: column; align-items: center; gap: 0.25rem;
            padding: 0.35rem 1rem 0.9rem; text-align: center; transition: padding 0.35s ease;
            background: radial-gradient(78% 58% at 50% 24%, color-mix(in srgb, var(--farbe) 17%, transparent), transparent 72%); }
    /* Sizing-Box ohne Kreis-Clip -> freigestellte Figur. */
    #kopf-avatar { width: var(--figur); height: var(--figur); flex-shrink: 0; position: relative;
                   transition: width 0.35s ease, height 0.35s ease; }
    #kopf-avatar svg, #kopf-avatar img, #initial { width: 100%; height: 100%; display: block; }
    #kopf-avatar svg { transform-origin: center bottom; animation: atmen 3.5s ease-in-out infinite;
                       filter: drop-shadow(0 10px 15px color-mix(in srgb, var(--farbe) 30%, transparent)); }
    /* Freigestellte Figur: ganze Figur zeigen (contain), kein Kreis. */
    #kopf-img { object-fit: contain; display: none;
                filter: drop-shadow(0 12px 16px color-mix(in srgb, var(--farbe) 38%, transparent)); }
    /* Notfall-Anzeige, falls (noch) kein Charakterbild lädt: Initial in Markenfarbe.
       Kein Orb — nur damit die Bühne nie leer/durchsichtig ist. */
    #initial { border-radius: 50%; display: none; align-items: center; justify-content: center;
               font-weight: 700; font-size: calc(var(--figur) * 0.38); color: #fff; background: var(--farbe);
               box-shadow: 0 0 0 4px color-mix(in srgb, var(--farbe) 13%, #fff),
                           0 10px 22px -10px rgba(15,23,42,0.4); }
    #kopf-avatar.sprechen { animation: redenBob 0.5s ease-in-out infinite; }
    @keyframes redenBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    #kopf-name { font-weight: 650; font-size: 1.05rem; color: #1f2937; line-height: 1.2; margin-top: 0.15rem;
                 transition: font-size 0.3s ease; }
    #kopf-rolle { font-size: 0.8rem; color: #64748b; }
    #kopf-online { font-size: 0.72rem; color: #2e7d32; display: flex; align-items: center; gap: 0.32rem; justify-content: center; }
    #kopf-online::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #4ade80;
                           box-shadow: 0 0 0 0 rgba(74,222,128,0.7); animation: puls 2.4s ease-out infinite; }
    @keyframes puls { 0% { box-shadow: 0 0 0 0 rgba(74,222,128,0.6); } 70%,100% { box-shadow: 0 0 0 6px rgba(74,222,128,0); } }
    /* Die Vorschläge stehen nicht mehr hier bei der Figur, sondern in der
       Eingabe-Karte unten (#komponist) — dort, wo gefragt wird. */
    /* Sobald ein Gespräch läuft: Bühne etwas kompakter, Rolle/Chips weg. Die
       Figur bleibt aber gross und praesent — sie schrumpfte hier frueher auf
       Daumennagelgroesse, womit das Gegenueber im Gespraech verschwand. */
    body.hat-verlauf #held { --figur: min(250px, 52vw, 30vh); }
    body.hat-verlauf #kopf-name { font-size: 0.92rem; }
    body.hat-verlauf #kopf-rolle, body.hat-verlauf #chips { display: none; }
    body.hat-verlauf #held { padding-bottom: 0.55rem; }
    /* Schallwellen — nur beim Vorlesen sichtbar */
    #welle { display: none; gap: 3px; align-items: center; height: 13px; margin-top: 0.05rem; }
    #welle span { width: 3px; height: 13px; border-radius: 2px; background: var(--farbe);
                  animation: welle 0.5s ease-in-out infinite; }
    #welle span:nth-child(2){animation-delay:.1s} #welle span:nth-child(3){animation-delay:.2s}
    #welle span:nth-child(4){animation-delay:.15s} #welle span:nth-child(5){animation-delay:.05s}
    @keyframes welle { 0%,100%{transform:scaleY(0.4)} 50%{transform:scaleY(1)} }

    /* Avatar-Zustände (vom Hauptchat übernommen) */
    @keyframes atmen { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }
    .augen { transform-box: fill-box; transform-origin: center; animation: blinzeln 4s infinite; }
    @keyframes blinzeln { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }
    .wange { opacity: 0; transition: opacity 0.3s; }
    .mund { transform-box: fill-box; transform-origin: center; }
    #kopf-avatar.denken svg { animation: wackeln 1.2s ease-in-out infinite; }
    @keyframes wackeln { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    #kopf-avatar.denken .augen { animation: none; transform: translateY(-3px); }
    #kopf-avatar.sprechen .mund { animation: reden 0.28s ease-in-out infinite; }
    @keyframes reden { 0%,100% { transform: scaleY(0.5); } 50% { transform: scaleY(1.3); } }
    #kopf-avatar.verlegen .wange { opacity: 0.75; }
    #kopf-avatar.verlegen .augen { animation: none; transform: translateX(3px); }
    #kopf-avatar.freuen svg { animation: huepf 0.6s ease; }
    @keyframes huepf { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-8px); } }

    /* --- Chatverlauf (Hauptbereich unter dem Charakter) --- */
    /* overscroll-behavior: contain haelt den Scroll HIER an, sobald der
       Verlauf am oberen/unteren Ende ankommt — er "kettet" sich sonst weiter
       zu html/body dieses Dokuments und von dort (dieses Dokument sitzt im
       Widget-iframe auf der Kundenseite) potenziell bis zur Kundenseite durch. */
    #chat { flex: 1; overflow-y: auto; overscroll-behavior-y: contain;
            padding: 0.3rem 0.9rem 0.9rem; display: flex; flex-direction: column;
            gap: 0.5rem; scroll-behavior: smooth; }
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--farbe) 22%, transparent); border-radius: 999px; }
    .msg { padding: 0.62rem 0.85rem; border-radius: 16px; max-width: 84%; white-space: pre-wrap;
           font-size: var(--schrift); line-height: 1.45; animation: msgRein 0.34s cubic-bezier(0.22,1,0.36,1) both; }
    @keyframes msgRein { from { opacity: 0; transform: translateY(7px) scale(0.98); } to { opacity: 1; transform: none; } }
    .user { align-self: flex-end; color: #fff; border-bottom-right-radius: 5px;
            background: linear-gradient(135deg, var(--farbe), var(--farbe-dunkel));
            box-shadow: 0 6px 16px -8px color-mix(in srgb, var(--farbe) 70%, transparent); }
    .bot  { align-self: flex-start; background: rgba(255,255,255,0.9); border: 1px solid var(--linie);
            border-bottom-left-radius: 5px; box-shadow: 0 4px 14px -10px rgba(15,23,42,0.4);
            -webkit-backdrop-filter: blur(6px); backdrop-filter: blur(6px); }
    .meta { color: #94a3b8; font-style: italic; background: transparent; border: 0; box-shadow: none; padding: 0.3rem 0.4rem; }

    /* "tippt…" Punkte */
    .tippt { display: inline-flex; gap: 4px; align-items: center; padding: 0.15rem 0.1rem; }
    .tippt span { width: 7px; height: 7px; border-radius: 50%;
                  background: color-mix(in srgb, var(--farbe) 55%, #94a3b8); animation: tip 1.3s infinite; }
    .tippt span:nth-child(2) { animation-delay: 0.18s; }
    .tippt span:nth-child(3) { animation-delay: 0.36s; }
    @keyframes tip { 0%,60%,100% { opacity: 0.28; transform: translateY(0); } 30% { opacity: 1; transform: translateY(-4px); } }

    /* --- Eingabe: EINE Karte statt einer Leiste ---------------------------
       Die flache Leiste am unteren Rand sah aus wie das Suchfeld einer Seite.
       Als Karte ist sie ein eigener Ort: Vorschläge oben, Zeile zum Tippen in
       der Mitte, Werkzeuge und Senden unten. Der Blick geht von "was könnte
       ich fragen" zu "hier tippe ich" zu "so schicke ich es ab". */
    #komponist { flex-shrink: 0; margin: 0.15rem 0.6rem 0.6rem; padding: 0.5rem;
                 background: #fff; border: 1px solid var(--linie); border-radius: 22px;
                 box-shadow: 0 6px 22px -14px rgba(15,23,42,0.5), 0 1px 3px rgba(15,23,42,0.04);
                 transition: box-shadow 0.2s, border-color 0.2s; }
    #komponist:focus-within { border-color: color-mix(in srgb, var(--farbe) 45%, var(--linie));
                 box-shadow: 0 10px 26px -14px color-mix(in srgb, var(--farbe) 65%, transparent),
                             0 0 0 3px color-mix(in srgb, var(--farbe) 12%, transparent); }
    #form { display: flex; flex-direction: column; gap: 0.35rem; }
    #input { width: 100%; padding: 0.5rem 0.6rem 0.2rem; border: 0; background: transparent;
             font: inherit; font-size: var(--schrift); color: #0f172a; }
    #input:focus { outline: none; }
    #input::placeholder { color: #94a3b8; }

    /* Unterste Zeile: links die Werkzeuge, rechts das Senden. */
    .k-reihe { display: flex; align-items: center; justify-content: space-between; gap: 0.4rem; }
    .k-werkzeuge { display: flex; align-items: center; gap: 0.3rem; min-width: 0; }
    /* Werkzeug-Pillen: Symbol plus Wort. Ein Symbol allein muss geraten werden,
       und "Vorlesen" ist nichts, wofür jemand raten will. */
    /* Mit #komponist davor, weil lib/chat-ui.js seine .ki-mic-Regeln zur
       Laufzeit in den <head> nachschiebt — die stünden sonst später und würden
       das Mikrofon wieder zum 40px-Quadrat machen. */
    #komponist .k-pille { display: inline-flex; align-items: center; gap: 0.35rem; height: 32px;
               width: auto; padding: 0 0.7rem;
               border: 1px solid var(--linie); border-radius: 999px; background: #fff; cursor: pointer;
               font: inherit; font-size: 0.76rem; color: #64748b; white-space: nowrap;
               transition: background 0.18s, color 0.18s, border-color 0.18s; }
    #komponist .k-pille svg { width: 15px; height: 15px; flex-shrink: 0; }
    #komponist .k-pille:hover { color: var(--farbe);
               border-color: color-mix(in srgb, var(--farbe) 40%, var(--linie)); background: var(--tint); }
    /* Aufnahme läuft: rot, wie in lib/chat-ui.js gedacht — nur in Pillen-Form. */
    #komponist .ki-mic.hoert { background: #ef4444; border-color: transparent; color: #fff; }
    /* Eingeschaltet (Vorlesen an): die Pille füllt sich. Mit #komponist davor,
       sonst gewinnt die allgemeine Pillen-Regel weiter unten (gleich stark,
       aber später) und die Pille bliebe weiss. */
    #komponist #stimme.an { background: var(--farbe); border-color: transparent; color: #fff; }
    #komponist #stimme.an:hover { background: var(--farbe-dunkel); color: #fff; }
    #send { width: 38px; height: 38px; flex-shrink: 0; padding: 0; border: 0; border-radius: 50%; color: #fff;
            cursor: pointer; font-size: 1.1rem; display: grid; place-items: center;
            background: linear-gradient(135deg, var(--farbe), var(--farbe-dunkel));
            box-shadow: 0 5px 14px -5px color-mix(in srgb, var(--farbe) 70%, transparent);
            transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s; }
    #send:hover:not(:disabled) { transform: translateY(-1px) scale(1.05);
            box-shadow: 0 8px 18px -6px color-mix(in srgb, var(--farbe) 75%, transparent); }
    #send:disabled { opacity: 0.45; cursor: default; }

    /* Vorschläge in der Karte: nebeneinander liegende Kacheln, nicht Pillen —
       ganze Fragen brauchen zwei Zeilen, eine Pille zwingt sie in eine.
       Überschreibt die Pillen-Form aus lib/chat-ui.js. */
    #chips { display: block; }
    #chips:empty { display: none; }
    #komponist .ki-vorschlaege { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; margin: 0 0 6px; }
    #komponist .ki-vorschlag { padding: 0.5rem 0.6rem; border-radius: 14px; text-align: left;
              font-size: 0.74rem; line-height: 1.3; white-space: normal; box-shadow: none;
              background: var(--tint); color: #475569;
              border: 1px solid color-mix(in srgb, var(--farbe) 12%, var(--linie)); }
    #komponist .ki-vorschlag:hover { background: var(--tint); color: var(--farbe); transform: none;
              border-color: color-mix(in srgb, var(--farbe) 45%, transparent); box-shadow: none; }
    /* Ohne eigene Fläche: Die Karte darüber schwebt, ein weisser Balken darunter
       machte daraus wieder eine Leiste. */
    .fuss { text-align: center; font-size: 0.64rem; color: #9aa3af; padding: 0 0 0.45rem; }
    .fuss a { color: inherit; text-decoration: none; }

    /* ═══ VOLLBILD: zweispaltig ═══════════════════════════════════════════
       ÜBERNOMMEN aus index.html (dort schon gebaut und bewährt) — dasselbe
       Layout, nur auf die Bezeichner dieses Frames gelegt: #topbar statt
       #kopfleiste, #held statt #buehne, #form statt form.
       Die Figur bekommt eine eigene Spalte und bleibt dadurch IMMER gross —
       sie muss sich den Platz nicht mehr mit dem Text teilen und schrumpft nie.
       Rechts leben Verlauf und Eingabe zusammen. Ausserhalb des Vollbilds
       bleibt das Layout unverändert einspaltig.
       Die Breite misst hier ausnahmsweise richtig: Im Vollbild IST dieser Frame
       der ganze Bildschirm. */
    @media (min-width: 900px) {
      body.vollbild { display: grid; grid-template-columns: minmax(320px, 38%) 1fr;
        grid-template-rows: auto 1fr auto; }
      body.vollbild #topbar { grid-column: 1 / -1; grid-row: 1; }
      /* Statt einer Trennlinie zur rechten Spalte trägt die Bühne ihren eigenen
         weichen Schein — der grenzt die Figur ab, ohne zu schneiden. */
      body.vollbild #held { grid-column: 1; grid-row: 2 / 4; min-height: 0;
        justify-content: center;
        background: radial-gradient(72% 58% at 50% 45%, var(--tint), transparent 76%);
        --figur: min(520px, 34vw, 62vh) !important; }
      /* Auch im laufenden Gespräch: eigene Spalte, also keine Verkleinerung.
         Rolle und Name dürfen hier stehen bleiben, der Platz ist da. */
      body.vollbild.hat-verlauf #kopf-name { font-size: 1.05rem; }
      body.vollbild.hat-verlauf #kopf-rolle { display: block; }
      body.vollbild #chat { grid-column: 2; grid-row: 2; padding: 1.4rem 1.6rem; }
      /* In der rechten Spalte sitzt jetzt die ganze Eingabe-Karte, nicht mehr
         das nackte Formular. */
      body.vollbild #komponist { grid-column: 2; grid-row: 3; margin: 0 1.6rem 1.2rem; padding: 0.6rem; }
      /* Breite Spalte: die Vorschlags-Kacheln dürfen nebeneinander atmen. */
      body.vollbild #komponist .ki-vorschlaege { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      body.vollbild .fuss { display: none; }
    }

    @media (prefers-reduced-motion: reduce) {
      #kopf-avatar svg, #kopf-avatar.sprechen, #kopf-online::before, .augen, .msg,
      .tippt span, #welle span { animation: none !important; }
      #chat { scroll-behavior: auto; }
    }
  </style>
</head>
<body>
  <div id="topbar">
    <!-- Lage und Vollbild gehören dem Fenster, nicht dem Chat: Sie sind darum
         versteckt, bis das Widget meldet, dass es sie ausführen kann. Steht der
         Chat woanders (Dashboard-Testchat, direkt aufgerufen), bleiben sie weg
         statt tote Knöpfe zu sein. -->
    <button id="lage" class="rund-btn nur-fenster" type="button" aria-label="Fenster anders stellen" title="Fenster anders stellen"></button>
    <button id="vollbild" class="rund-btn nur-fenster" type="button" aria-label="Vollbild" title="Vollbild" aria-pressed="false"></button>
    <button id="schliessen" class="rund-btn" aria-label="Schliessen" title="Schliessen">×</button>
  </div>

  <!-- Charakter: runder Avatar mittig oben. Bleibt beim Sprechen animiert
       (Wippen/Klappmaul) und liest optional laut vor. -->
  <div id="held">
    <div id="kopf-avatar">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <ellipse class="koerper" cx="60" cy="62" rx="44" ry="42" fill="var(--akzent)" />
        <ellipse cx="60" cy="74" rx="26" ry="22" fill="#ffffff" opacity="0.35" />
        <circle class="wange" cx="38" cy="66" r="7" fill="#ff8a8a" />
        <circle class="wange" cx="82" cy="66" r="7" fill="#ff8a8a" />
        <g class="augen" fill="#1b2a22">
          <circle cx="47" cy="55" r="6" /><circle cx="73" cy="55" r="6" />
          <circle cx="49" cy="53" r="2" fill="#fff" /><circle cx="75" cy="53" r="2" fill="#fff" />
        </g>
        <ellipse class="mund" cx="60" cy="73" rx="9" ry="5" fill="#1b2a22" />
      </svg>
      <img id="kopf-img" alt="Charakter" />
      <div id="initial" aria-hidden="true"></div>
    </div>
    <div id="kopf-name">Assistent</div>
    <div id="kopf-rolle"></div>
    <div id="kopf-online">Online</div>
    <div id="welle" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  </div>

  <div id="chat"></div>

  <!-- Eingabe als KARTE, nicht als Leiste: oben die Vorschläge (was man hier
       fragen könnte), darunter die Zeile zum Tippen, unten die Werkzeuge links
       und Senden rechts. Alles, was zum Fragen gehört, liegt damit an einem
       Ort und in einer Umrandung — statt Chips oben bei der Figur, Mikrofon im
       Feld und Vorlesen in der Kopfleiste.
       #chips steht bewusst INNERHALB der Karte: Die Vorschläge sind der erste
       Zug des Besuchers, nicht Beiwerk der Figur. -->
  <div id="komponist">
    <div id="chips"></div>
    <form id="form">
      <input id="input" placeholder="Frag mich etwas…" autocomplete="off" />
      <div class="k-reihe">
        <div class="k-werkzeuge">
          <button id="mic" type="button" class="ki-mic k-pille" aria-label="Spracheingabe" title="Sprechen"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg><span>Sprechen</span></button>
          <button id="stimme" type="button" class="k-pille" aria-label="Vorlesen einschalten" aria-pressed="false" title="Antworten vorlesen"><svg id="stimme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg><span>Vorlesen</span></button>
        </div>
        <button id="send" type="submit" aria-label="Senden">→</button>
      </div>
    </form>
  </div>
  <div class="fuss">mit KI-Agent</div>

  <!-- Bewusst OHNE Supabase-Skripte (Milestone 0): Das Widget läuft im BESUCHER-
       Kontext und liest Firmendaten ausschliesslich über die gefilterte
       /firma-Function — keine privaten Felder, kein Direktzugriff auf die DB. -->
  <script src="lib/chat-ui.js"></script>
  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const avatar = document.getElementById("kopf-avatar");
    const avatarImg = document.getElementById("kopf-img");
    const kopfName = document.getElementById("kopf-name");
    const kopfRolle = document.getElementById("kopf-rolle");
    const chips = document.getElementById("chips");
    const welle = document.getElementById("welle");
    const stimmeBtn = document.getElementById("stimme");

    const _p = new URLSearchParams(location.search);
    const FIRMA_ID = _p.get("firma") || "salbei";
    // Seiten-Kontext vom Widget: welche Unterseite (pfad/titel) UND was steht
    // dort (inhalt, gekürzt) — damit der Agent zum Seiteninhalt antworten kann.
    // Start aus den URL-Parametern, damit sofort Kontext da ist.
    // BEWUSST dasselbe Objekt behalten und nur befüllen: ChatUI.starten() merkt
    // sich diese Referenz einmal beim Start. Eine Neuzuweisung käme dort nie an.
    const seiteInfo = {
      pfad: _p.get("pfad") || "",
      titel: _p.get("titel") || "",
      inhalt: _p.get("inhalt") || "",
    };
    // Nachschlag vom Widget: die strukturierten Auszeichnungen der Seite
    // (JSON-LD, og:/product:-Meta). Zu gross für die URL, darum per Nachricht.
    // Nur vom eigenen Eltern-Fenster annehmen — sonst könnte jedes fremde Fenster
    // dem Agenten eine erfundene Produktseite unterschieben.
    window.addEventListener("message", (e) => {
      if (e.source !== parent) return;
      if (!e.data || e.data.type !== "ki-agent-seite") return;
      const s = e.data.seite;
      if (!s || typeof s !== "object") return;
      if (s.pfad) seiteInfo.pfad = String(s.pfad);
      if (s.titel) seiteInfo.titel = String(s.titel);
      if (s.inhalt) seiteInfo.inhalt = String(s.inhalt);
      seiteInfo.jsonLd = Array.isArray(s.jsonLd) ? s.jsonLd : [];
      seiteInfo.meta = s.meta && typeof s.meta === "object" ? s.meta : {};
      // Verhaltenssignale (anonyme Zähler). Das Widget frischt sie auf, solange
      // der Chat offen ist — sonst rechnete der Agent mitten im Gespräch mit
      // der Verweildauer von vor fünf Minuten.
      seiteInfo.verhalten = s.verhalten && typeof s.verhalten === "object" ? s.verhalten : null;
    });
    let bilder = null;       // generierte Charakter-Bilder pro Zustand (sonst SVG-Fallback)

    // --- Schliessen: dem Eltern-Fenster (widget.js) Bescheid geben ---
    document.getElementById("schliessen").addEventListener("click", () => {
      if ("speechSynthesis" in window) window.speechSynthesis.cancel(); // nicht weiterreden
      parent.postMessage({ type: "ki-agent-schliessen" }, "*");
    });

    // --- Charakter-Steuerung (Bild wenn vorhanden, sonst Platzhalter-SVG) ---
    // Die Zustands-KLASSE wird immer gesetzt (auch im Bild-Modus), damit
    // Bühnen-Animationen wie das Sprech-Wippen für beide Darstellungen greifen.
    // Klappmaul: solange gesprochen wird, zwischen dem Sprechen-Bild (Mund zu)
    // und dem sprechen_offen-Bild (Mund offen) wechseln -> das Maskottchen
    // bewegt wirklich den Mund. Nur wenn beide Bilder vorhanden sind; sonst
    // wippt die Figur (CSS) wie bisher.
    let flapTimer;
    function stopFlap() { clearInterval(flapTimer); flapTimer = null; }

    let revertTimer;
    function setCharakter(zustand, dauer) {
      clearTimeout(revertTimer);
      stopFlap();
      avatar.className = zustand === "idle" ? "" : zustand;
      const bildKey = zustand === "idle" ? "idle" : zustand;
      const svgEl = avatar.querySelector("svg");
      const initialEl = document.getElementById("initial");
      // Initial (Notfall) aus dem Agenten-Namen ableiten.
      const nm = (kopfName.textContent || FIRMA_ID || "•").trim();
      initialEl.textContent = (nm.charAt(0) || "•").toUpperCase();
      if (bilder && (bilder[bildKey] || bilder.idle)) {
        // Generiertes Maskottchen. Lädt ein Bild nicht (kaputte/abgelaufene URL),
        // NICHT leer/durchsichtig bleiben -> auf das Initial zurück.
        avatarImg.onerror = () => { avatarImg.style.display = "none"; initialEl.style.display = "flex"; };
        avatarImg.src = bilder[bildKey] || bilder.idle;
        avatarImg.style.display = "block";
        svgEl.style.display = "none";
        initialEl.style.display = "none";
        if (zustand === "sprechen" && bilder.sprechen_offen && bilder.sprechen) {
          let auf = false;
          flapTimer = setInterval(() => {
            auf = !auf;
            avatarImg.src = auf ? bilder.sprechen_offen : bilder.sprechen;
          }, 180);
        }
      } else {
        // Noch kein Charakterbild (z.B. Abo nicht aktiv): Initial in Markenfarbe.
        avatarImg.style.display = "none";
        svgEl.style.display = "none";
        initialEl.style.display = "flex";
      }
      // Auch dem Eltern-Fenster (widget.js) melden: Die Launcher-FIGUR auf der
      // Kundenseite spiegelt den Zustand (denkt/spricht mit), wenn die Firma
      // eigene Zustands-Bilder hat.
      try { parent.postMessage({ type: "ki-agent-zustand", zustand: zustand }, "*"); } catch (e) {}
      if (dauer) revertTimer = setTimeout(() => setCharakter("idle"), dauer);
    }

    // --- Stimme: der Charakter liest die Antwort laut vor (Browser-TTS).
    // Standardmässig AUS (fremde Firmenseite -> keine Überraschung); der Besucher
    // schaltet sie per Knopf ein. Wahl bleibt pro Browser gemerkt. ---
    const TTS = ("speechSynthesis" in window);
    let stimmeAn = false;
    try { stimmeAn = localStorage.getItem("kiagent-stimme") === "1"; } catch (e) {}
    if (!TTS) { stimmeBtn.style.display = "none"; }
    function malStimmeKnopf() {
      stimmeBtn.classList.toggle("an", stimmeAn);
      stimmeBtn.setAttribute("aria-pressed", String(stimmeAn));
      stimmeBtn.setAttribute("aria-label", stimmeAn ? "Vorlesen ausschalten" : "Vorlesen einschalten");
      const ic = document.getElementById("stimme-icon");
      // an: Lautsprecher mit Wellen; aus: durchgestrichen
      ic.innerHTML = stimmeAn
        ? '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>'
        : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
    }
    malStimmeKnopf();
    stimmeBtn.addEventListener("click", () => {
      stimmeAn = !stimmeAn;
      try { localStorage.setItem("kiagent-stimme", stimmeAn ? "1" : "0"); } catch (e) {}
      malStimmeKnopf();
      if (!stimmeAn && TTS) { window.speechSynthesis.cancel(); welle.style.display = "none"; }
    });
    let sprechTimer;
    function beendeSprechen() {
      clearTimeout(sprechTimer);
      welle.style.display = "none";
      setCharakter("idle");
    }
    function liesVor(text) {
      if (!stimmeAn || !TTS || !text) return false;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "de-DE";
        setCharakter("sprechen");            // Zustand halten, solange gesprochen wird
        welle.style.display = "flex";
        u.onend = beendeSprechen;
        u.onerror = beendeSprechen;
        // Sicherheitsnetz: feuert onend nie (kein Audiogerät / Browser-Eigenheit),
        // wird der Sprech-Zustand nach einer geschätzten Dauer trotzdem beendet.
        clearTimeout(sprechTimer);
        sprechTimer = setTimeout(beendeSprechen, Math.min(30000, 2500 + text.length * 90));
        window.speechSynthesis.speak(u);
        return true;
      } catch (e) { beendeSprechen(); return false; }
    }

    function addTipptAnzeige() {
      const div = document.createElement("div");
      div.className = "msg bot meta";
      div.innerHTML = '<span class="tippt"><span></span><span></span><span></span></span>';
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
      return div;
    }

    function setFarben(c) {
      if (c.farbe) document.documentElement.style.setProperty("--farbe", c.farbe);
      if (c.akzent) document.documentElement.style.setProperty("--akzent", c.akzent);
      if (c.bilder) bilder = c.bilder;
    }

    // Firma laden — NUR über die gefilterte /firma-Function (Seed + Onboarding-
    // Firmen). Liefert auch faq/fakten für die Vorschlags-Chips, aber keine
    // privaten Felder. Der Prompt wird sowieso serverseitig gebaut (chat.js).
    async function start() {
      let quelle = null;
      try {
        const res = await fetch("/.netlify/functions/firma?id=" + encodeURIComponent(FIRMA_ID));
        if (res.ok) {
          const f = await res.json();
          quelle = f;
          setFarben(f.charakter || {});
          if (f.persona) kopfName.textContent = f.persona;
          else if (f.name) kopfName.textContent = f.name;
          if (f.rolle) kopfRolle.textContent = f.rolle;
        }
      } catch (e) { /* Aussehen ist nicht kritisch */ }
      setCharakter("freuen", 700);
      ui.addBubble("Hallo! Wie kann ich dir helfen?", "bot");
      // Zwei Kacheln, nicht vier: Die Karte sitzt über dem Verlauf und nimmt ihm
      // jede weitere Zeile weg. Zwei gute Einstiege sind ein Angebot, vier sind
      // eine Liste, die man erst lesen muss.
      ui.zeigeVorschlaege(ChatUI.vorschlaegeAus(quelle).slice(0, 2));
    }

    // Gemeinsame Chat-Logik aus lib/chat-ui.js. Der Charakter oben reagiert über
    // den avatar-Callback (denken/sprechen); onAntwort liest optional laut vor.
    // Chips erscheinen auf der Bühne; sobald der Besucher fragt, wird die Bühne
    // kompakt (hat-verlauf) und die Nachrichten erscheinen im Chatverlauf.
    // Platz-Regler: Die Figur gibt in Stufen Platz ab, sobald der Verlauf ihn
    // braucht, und bleibt dabei bis zuletzt eine erkennbare Figur (Untergrenze
    // ist die letzte Stufe), damit das Gespraechsgefuehl nicht kippt.
    const figur = ChatUI.figurRegler({
      buehne: document.getElementById("held"),
      chat,
      // Im Vollbild hat die Figur eine eigene Spalte — dort nie schrumpfen
      // (gleiche Regel wie in index.html).
      aktiv: () => !document.body.classList.contains("vollbild"),
      stufen: [
        "min(250px, 52vw, 30vh)",
        "min(200px, 44vw, 25vh)",
        "min(165px, 38vw, 21vh)",
        "min(135px, 32vw, 17vh)",
      ],
    });

    const ui = ChatUI.starten({
      chat, form, input, send,
      firmaId: FIRMA_ID,
      avatar: setCharakter,
      tipptAn: addTipptAnzeige,
      seiteInfo: seiteInfo,
      // Zeige-Aktionen kann der Chat nicht selbst ausführen — er sitzt im
      // iframe und kommt an die Seite gar nicht heran. Also weiterreichen an
      // das Widget, das sie noch einmal prüft und dann ausführt.
      onSeitenAktion: (a) => {
        try { parent.postMessage({ type: "ki-agent-aktion", aktion: a }, "*"); } catch (e) {}
      },
      chipsZiel: chips,
      nachNachricht: () => figur.pruefe(),
      onFrage: () => { document.body.classList.add("hat-verlauf"); },
      onAntwort: (text) => { liesVor(text); },
    });
    ChatUI.spracheAn(document.getElementById("mic"), input);

    // --- Fenster-Steuerung: Lage und Vollbild -----------------------------
    //
    // Der Chat sitzt im iframe und kann sich nicht selbst verschieben — er sagt
    // nur, was der Besucher will; ausgeführt wird es vom Widget. Welche Lagen
    // es überhaupt gibt, gibt ebenfalls das Widget vor (beim Orb sind das zwei,
    // bei der Gesprächsleiste drei) — so muss der Chat nichts über die
    // Darstellung auf der Kundenseite wissen.
    const lageBtn = document.getElementById("lage");
    const vollBtn = document.getElementById("vollbild");
    const LAGE_NAME = { links: "Links andocken", rechts: "Rechts andocken", mitte: "Mittig stellen" };
    const LAGE_ICON = {
      // Rahmen mit gefüllter Seite: zeigt, WOHIN es geht, nicht wo es ist.
      links: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M9 4v16" /><path d="M3 8h6M3 12h6M3 16h6"/>',
      rechts: '<rect x="3" y="4" width="18" height="16" rx="2"/><path d="M15 4v16" /><path d="M15 8h6M15 12h6M15 16h6"/>',
      mitte: '<rect x="6" y="4" width="12" height="16" rx="2"/>',
    };
    // Dieselben Symbole wie im Vollbild-Knopf von index.html — dort schon
    // gezeichnet, hier nur wiederverwendet.
    const VOLL_ICON = {
      an: '<path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/>',
      aus: '<path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/>',
    };
    function svg(inhalt) {
      return '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ' +
        'stroke-linecap="round" stroke-linejoin="round">' + inhalt + "</svg>";
    }

    let lagen = [];
    let lageNr = 0;
    let istVollbild = false;

    function zeichneFensterKnoepfe() {
      if (lagen.length > 1) {
        const ziel = lagen[(lageNr + 1) % lagen.length];
        lageBtn.innerHTML = svg(LAGE_ICON[ziel] || LAGE_ICON.rechts);
        lageBtn.title = LAGE_NAME[ziel] || "Fenster anders stellen";
        lageBtn.setAttribute("aria-label", lageBtn.title);
      }
      vollBtn.innerHTML = svg(istVollbild ? VOLL_ICON.aus : VOLL_ICON.an);
      vollBtn.title = istVollbild ? "Vollbild verlassen" : "Vollbild";
      vollBtn.setAttribute("aria-label", vollBtn.title);
      vollBtn.setAttribute("aria-pressed", istVollbild ? "true" : "false");
    }

    function sagWidget(nachricht) {
      try { parent.postMessage(nachricht, "*"); } catch (err) { /* egal */ }
    }

    // Im Vollbild schaltet dieser Frame auf das ZWEISPALTIGE Layout aus
    // index.html um: Figur links in eigener Spalte, Verlauf und Eingabe rechts.
    // Dort hat die Figur ihren eigenen Platz und soll NIE schrumpfen — der
    // Platz-Regler wird deshalb stillgelegt (aktiv-Prüfung unten) und seine
    // bereits gesetzte Grösse zurückgenommen, damit die Spaltengrösse greift.
    // Beim Verlassen läuft er wieder.
    function setzeVollbild(an) {
      istVollbild = an;
      document.body.classList.toggle("vollbild", an);
      figur.zuruecksetzen();
      if (!an) figur.pruefe();
      zeichneFensterKnoepfe();
    }

    lageBtn.addEventListener("click", () => {
      if (lagen.length < 2) return;
      lageNr = (lageNr + 1) % lagen.length;
      // Andocken heisst: kein Vollbild mehr. Sonst führte der Knopf sichtbar zu
      // nichts, weil das Vollbild jede Lage überdeckt.
      sagWidget({ type: "ki-agent-lage", lage: lagen[lageNr] });
      setzeVollbild(false);
    });
    vollBtn.addEventListener("click", () => {
      sagWidget({ type: "ki-agent-vollbild", an: !istVollbild });
      setzeVollbild(!istVollbild);
    });

    // --- Nachrichten vom Widget -------------------------------------------
    // "ki-agent-fokus": Fenster ist aufgefahren -> Schreibcursor ins Feld. Wer
    //   den Chat öffnet, will schreiben.
    // "ki-agent-fenster": Das Widget bietet die Fenster-Steuerung an und sagt,
    //   welche Lagen es gibt und wie es gerade steht (aus früherem Besuch).
    // Nur vom eigenen Eltern-Fenster — dieselbe Regel wie beim Seiten-Kontext.
    window.addEventListener("message", (e) => {
      if (e.source !== parent || !e.data) return;
      if (e.data.type === "ki-agent-fokus") {
        try { input.focus(); } catch (err) { /* egal */ }
      }
      if (e.data.type === "ki-agent-fenster") {
        lagen = Array.isArray(e.data.lagen) ? e.data.lagen : [];
        lageNr = Math.max(0, lagen.indexOf(e.data.lage));
        document.body.classList.add("fenster-steuerbar");
        document.body.classList.toggle("fenster-schmal", !!e.data.schmal);
        if (lagen.length < 2) lageBtn.style.display = "none";
        // Aus einem früheren Besuch kann das Vollbild schon an sein — dann muss
        // auch das zweispaltige Layout gleich stehen, nicht erst nach einem Klick.
        setzeVollbild(!!e.data.vollbild);
      }
    });

    start();
  </script>
</body>
</html>
