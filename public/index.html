<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>KI-Agent MVP</title>
  <style>
    /* Standard-Farben — werden pro Firma aus den Daten überschrieben.
       Premium-Look (Milestone 9): Töne per color-mix aus --farbe abgeleitet. */
    :root {
      --farbe: #2D5694; --akzent: #9db8dd;
      --linie: color-mix(in srgb, var(--farbe) 14%, #e8eaed);
      --farbe-dunkel: color-mix(in srgb, var(--farbe) 82%, #000);
      --tint: color-mix(in srgb, var(--farbe) 7%, #ffffff);
    }
    /* Feste Bildschirmhöhe statt wachsender Seite: Kopf, Figur, Verlauf und
       Eingabe sind IMMER gleichzeitig sichtbar, gescrollt wird nur innerhalb des
       Verlaufs. Vorher wuchs die Seite mit und das Eingabefeld lag unter der
       Falz — man landete im Chat und sah nicht, wo man tippt. */
    html { height: 100%; overflow: hidden; }
    /* border-box ist hier Pflicht: mit content-box kaeme die Polsterung ZUSAETZLICH
       zu den 100dvh und die Seite scrollte doch wieder. */
    body { font-family: system-ui, -apple-system, "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased;
           max-width: 620px; margin: 0 auto; padding: 1rem 1rem 0.6rem; color: #0f172a;
           box-sizing: border-box; height: 100dvh; display: flex; flex-direction: column; overflow: hidden;
           background:
             radial-gradient(120% 60% at 100% 0%, color-mix(in srgb, var(--farbe) 8%, transparent), transparent 55%),
             linear-gradient(180deg, color-mix(in srgb, var(--farbe) 4%, #fff), #f7f8fa); }
    h1 { font-size: 1.15rem; color: #475569; text-align: center; font-weight: 650; letter-spacing: 0.01em; }

    /* EIN Panel statt vier lose Zonen: Kopf, Figur, Verlauf und Eingabe sitzen
       in DERSELBEN weissen Karte. Vorher hatte der Verlauf einen eigenen Rahmen,
       die Eingabe gar keinen und der Kopf schwebte darueber — das zerfiel
       optisch in Einzelteile.
       KONTURLOS: nirgends auf dieser Seite gibt es Rahmen oder Trennlinien.
       Abgegrenzt wird ueber Schlagschatten, weiche Scheine und getoente
       Fuellungen. Wo ein Element sonst weiss-auf-weiss verschwaende (Eingabe,
       Bot-Blasen, Kopf-Knoepfe), traegt es eine Tint-Fuellung statt einer
       Kontur — sonst waere es schlicht nicht mehr zu sehen. */
    #panel { flex: 1; min-height: 0; display: flex; flex-direction: column;
             background: #fff; border-radius: 22px; overflow: hidden;
             box-shadow: 0 18px 50px -26px rgba(15,23,42,0.4); }

    /* --- Charakter-Bühne (gleiche Erfahrung wie im eingebetteten Widget) --- */
    /* Keine Trennlinie: darunter beginnt sofort der Schein der Buehne, der
       trennt weich genug. Eine harte Linie wirkte dort willkuerlich. */
    #kopfleiste { display: flex; align-items: center; gap: 0.5rem; flex-shrink: 0;
                  padding: 0.7rem 0.95rem 0.5rem; }
    #kopfleiste .name { font-weight: 650; font-size: 1rem; }
    #kopfleiste .status { font-size: 0.75rem; color: #64748b; display: flex; align-items: center; gap: 0.32rem; }
    #kopfleiste .status::before { content: ""; width: 7px; height: 7px; border-radius: 50%; background: #4ade80; }
    #stimme { margin-left: auto; }
    /* Getoente Fuellung statt Kontur — ohne beides waeren die Knoepfe auf der
       weissen Karte unsichtbar. */
    #stimme, #vollbild { width: 36px; height: 36px; border: 0; border-radius: 50%;
              background: var(--tint); color: var(--farbe); cursor: pointer; display: grid; place-items: center; padding: 0;
              flex-shrink: 0; transition: background 0.18s, color 0.18s; }
    #stimme:hover, #vollbild:hover { background: color-mix(in srgb, var(--farbe) 16%, #fff); }
    #stimme.an { background: var(--farbe); color: #fff; }
    #stimme svg, #vollbild svg { width: 18px; height: 18px; display: block; }
    #vollbild svg[hidden] { display: none; }

    /* --figur steuert die Groesse der Figur an EINER Stelle (Bild + Notfall-
       Initial). Die Figur soll dominieren: man soll das Gefuehl haben, jemandem
       gegenueberzustehen, nicht ein Icon neben einem Textfeld zu sehen. Die
       vw/vh-Deckel verhindern, dass sie auf schmalen oder flachen Fenstern den
       Gespraechsverlauf verdraengt. */
    /* 38vh statt mehr: Die Figur soll dominieren, aber der Verlauf muss von
       Anfang an lesbar sein und nicht auf einen Streifen zusammengedrueckt
       werden. Ab hier uebernimmt der Platz-Regler (lib/chat-ui.js). */
    /* Kein eigener Rahmen/Radius mehr: die Buehne ist ein ABSCHNITT des Panels,
       nur der weiche Schein hebt sie ab. */
    #buehne { --figur: min(380px, 68vw, 38vh);
              flex-shrink: 0;
              display: flex; flex-direction: column; align-items: center; gap: 0.55rem; text-align: center;
              padding: 1rem 1rem 1.1rem;
              background: radial-gradient(125% 92% at 50% 0%, var(--tint), transparent 72%); }
    #avatar { width: var(--figur); height: var(--figur);
              filter: drop-shadow(0 12px 22px color-mix(in srgb, var(--farbe) 25%, transparent)); }
    #avatar svg, #avatar img { width: 100%; height: 100%; display: block; }
    #avatar svg { transform-origin: center bottom; animation: atmen 3.5s ease-in-out infinite; }
    #avatar-img { object-fit: contain; display: none; border-radius: 18px; }
    /* Notfall-Anzeige, falls (noch) kein Charakterbild lädt: Initial in Markenfarbe. */
    #initial { width: 100%; height: 100%; border-radius: 50%; display: none;
               align-items: center; justify-content: center;
               font-weight: 700; font-size: calc(var(--figur) * 0.38); color: #fff; background: var(--farbe); }
    #avatar.sprechen { animation: redenBob 0.5s ease-in-out infinite; }
    @keyframes redenBob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
    #welle { display: none; gap: 3px; align-items: center; height: 15px; }
    #welle span { width: 3px; height: 15px; border-radius: 2px; background: var(--farbe);
                  animation: welle 0.5s ease-in-out infinite; }
    #welle span:nth-child(2){animation-delay:.1s} #welle span:nth-child(3){animation-delay:.2s}
    #welle span:nth-child(4){animation-delay:.15s} #welle span:nth-child(5){animation-delay:.05s}
    @keyframes welle { 0%,100%{transform:scaleY(0.4)} 50%{transform:scaleY(1)} }
    /* Auf schmalen Schirmen brachen die Vorschlags-Chips auf drei bis vier
       Zeilen um. Eine einzige, seitlich schiebbare Zeile kostet nur noch eine
       Zeilenhoehe, alle Vorschlaege bleiben erreichbar. */
    @media (max-width: 560px) {
      #chat .ki-vorschlaege { flex-wrap: nowrap; overflow-x: auto; justify-content: flex-start;
                               scrollbar-width: none; -ms-overflow-style: none;
                               padding-bottom: 2px; max-width: 100%; }
      #chat .ki-vorschlaege::-webkit-scrollbar { display: none; }
      #chat .ki-vorschlag { flex-shrink: 0; }
    }
    #fusszeile { text-align: center; margin: 0.55rem 0 0; font-size: 0.78rem; flex-shrink: 0; }

    /* ruhiges Atmen (Grundzustand "idle") */
    @keyframes atmen { 0%,100% { transform: scale(1); } 50% { transform: scale(1.04); } }

    /* Augen blinzeln gelegentlich */
    .augen { transform-box: fill-box; transform-origin: center; animation: blinzeln 4s infinite; }
    @keyframes blinzeln { 0%,92%,100% { transform: scaleY(1); } 96% { transform: scaleY(0.1); } }

    /* Wangen (Erröten) — normal unsichtbar */
    .wange { opacity: 0; transition: opacity 0.3s; }
    /* Mund — Drehpunkt in der Mitte für die Sprech-Animation */
    .mund { transform-box: fill-box; transform-origin: center; }

    /* Zustand DENKEN: leicht wackeln, Augen wandern hoch */
    #avatar.denken svg { animation: wackeln 1.2s ease-in-out infinite; }
    @keyframes wackeln { 0%,100% { transform: rotate(-4deg); } 50% { transform: rotate(4deg); } }
    #avatar.denken .augen { animation: none; transform: translateY(-4px); }

    /* Zustand SPRECHEN: Mund bewegt sich */
    #avatar.sprechen .mund { animation: reden 0.28s ease-in-out infinite; }
    @keyframes reden { 0%,100% { transform: scaleY(0.5); } 50% { transform: scaleY(1.3); } }

    /* Zustand VERLEGEN: Wangen rot, Augen schauen weg, kurz schrumpfen */
    #avatar.verlegen .wange { opacity: 0.75; }
    #avatar.verlegen .augen { animation: none; transform: translateX(4px); }
    #avatar.verlegen svg { animation: schrumpf 2s ease-in-out; }
    @keyframes schrumpf { 0% { transform: scale(1); } 30% { transform: scale(0.93); } 100% { transform: scale(1); } }

    /* Zustand FREUEN (Begrüssung): kleiner Hüpfer */
    #avatar.freuen svg { animation: huepf 0.6s ease; }
    @keyframes huepf { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-12px); } }

    /* --- Chat --- */
    /* Der Verlauf ist das EINZIGE, was scrollt, und nimmt den Platz, der nach
       Kopf, Figur und Eingabe übrig bleibt. min-height:0 ist Pflicht, sonst
       weigert sich ein Flex-Kind zu schrumpfen und drückt die Eingabe raus. */
    /* Der Verlauf ist von Anfang an sichtbar (Begruessung + Vorschlaege stehen
       direkt darin) statt erst nach der ersten Nachricht — die Vorschlaege
       gehoeren zum Lesen/Antworten, nicht auf die Charakter-Buehne.
       Ohne Rahmen und ohne Trennlinie zur Buehne: darueber laeuft deren weicher
       Schein aus, der trennt genug. */
    #chat { padding: 1rem 1.1rem;
            flex: 1 1 auto; min-height: 0; overflow-y: auto;
            display: flex; flex-direction: column; gap: 0.55rem; }
    #chat::-webkit-scrollbar { width: 6px; }
    #chat::-webkit-scrollbar-thumb { background: color-mix(in srgb, var(--farbe) 22%, transparent); border-radius: 999px; }
    .msg { padding: 0.62rem 0.85rem; border-radius: 16px; max-width: 82%; white-space: pre-wrap; line-height: 1.45;
           animation: msgRein 0.34s cubic-bezier(0.22,1,0.36,1) both; }
    @keyframes msgRein { from { opacity: 0; transform: translateY(7px) scale(0.98); } to { opacity: 1; transform: none; } }
    .user { align-self: flex-end; color: #fff; border-bottom-right-radius: 5px;
            background: linear-gradient(135deg, var(--farbe), var(--farbe-dunkel));
            box-shadow: 0 6px 16px -8px color-mix(in srgb, var(--farbe) 70%, transparent); }
    /* Getoente Fuellung statt Kontur: eine weisse Blase auf weisser Karte waere
       ohne Rahmen nicht mehr zu sehen. */
    .bot  { align-self: flex-start; background: var(--tint); border-bottom-left-radius: 5px;
            box-shadow: 0 4px 14px -10px rgba(15,23,42,0.4); }
    .meta { color: #94a3b8; font-style: italic; box-shadow: none; background: transparent; }
    /* Eingabe als Fuss DES Panels — ohne Trennlinie, das getoente Eingabefeld
       setzt sich von selbst genug ab. */
    form { display: flex; gap: 0.5rem; align-items: center; flex-shrink: 0;
           padding: 0.75rem 0.95rem; background: #fff; }

    /* ═══ VOLLBILD: zweispaltig ═══════════════════════════════════════════
       NUR hier (Klasse kommt vom Vollbild-Knopf, plus genug Breite). Die Figur
       bekommt eine eigene Spalte und bleibt dadurch IMMER gross — sie muss sich
       den Platz nicht mehr mit dem Text teilen und schrumpft nie. Rechts leben
       Verlauf und Eingabe zusammen. Ausserhalb des Vollbilds bleibt das Layout
       unveraendert einspaltig. */
    @media (min-width: 900px) {
      body.vollbild { max-width: none; padding: 0; }
      /* Zeile 1 Kopf ueber beide Spalten, darunter links die Figur (ueber beide
         restlichen Zeilen), rechts Verlauf oben und Eingabe unten. */
      body.vollbild #panel { border-radius: 0; box-shadow: none;
        display: grid; grid-template-columns: minmax(320px, 38%) 1fr;
        grid-template-rows: auto 1fr auto; }
      body.vollbild #kopfleiste { grid-column: 1 / -1; grid-row: 1;
        padding: 0.8rem 1.3rem 0.7rem; }
      /* Linke Spalte: nur die Figur, mittig und GROSS — noch etwas grosszuegiger
         als vorher, da sie hier eine eigene Spalte hat und den Platz mit
         niemandem teilt. */
      /* Statt einer Trennlinie zur rechten Spalte traegt die Buehne hier ihren
         eigenen weichen Schein — der grenzt die Figur ab, ohne zu schneiden. */
      body.vollbild #buehne { grid-column: 1; grid-row: 2 / 4; min-height: 0;
        justify-content: center;
        background: radial-gradient(72% 58% at 50% 45%, var(--tint), transparent 76%);
        --figur: min(520px, 34vw, 62vh) !important; }
      /* Rechte Spalte: Verlauf (samt Vorschlaegen) oben, darunter die Eingabe. */
      body.vollbild #chat { grid-column: 2; grid-row: 2; padding: 1.4rem 1.6rem; }
      body.vollbild form { grid-column: 2; grid-row: 3; padding: 0.9rem 1.6rem; }
      body.vollbild #fusszeile { display: none; }
    }
    /* Getoente Fuellung statt Kontur — sonst waere das Feld auf der weissen
       Karte gar nicht mehr als Eingabe zu erkennen. Der Fokus zeigt sich ueber
       den Ring, nicht mehr ueber eine Rahmenfarbe. */
    input { flex: 1; padding: 0.7rem 0.95rem; border: 0; border-radius: 999px; font: inherit;
            background: var(--tint); transition: background 0.2s, box-shadow 0.2s; }
    input:focus { outline: none; background: #fff;
                  box-shadow: 0 0 0 3px color-mix(in srgb, var(--farbe) 18%, transparent); }
    button { padding: 0.7rem 1.2rem; border: 0; border-radius: 999px; color: #fff; cursor: pointer; font-weight: 600;
             background: linear-gradient(135deg, var(--farbe), var(--farbe-dunkel));
             box-shadow: 0 5px 14px -6px color-mix(in srgb, var(--farbe) 70%, transparent);
             transition: transform 0.2s, box-shadow 0.2s, opacity 0.2s; }
    button:hover:not(:disabled) { transform: translateY(-1px); }
    button:disabled { opacity: 0.5; cursor: default; }
    /* "denkt nach"-Punkte (Standard-Tipp-Anzeige im Verlauf) */
    .tippt { display: inline-flex; gap: 4px; align-items: center; }
    .tippt span { width: 7px; height: 7px; border-radius: 50%; background: #94a3b8; animation: tip 1.3s infinite; }
    .tippt span:nth-child(2){animation-delay:.18s} .tippt span:nth-child(3){animation-delay:.36s}
    @keyframes tip { 0%,60%,100%{opacity:.28;transform:translateY(0)} 30%{opacity:1;transform:translateY(-4px)} }
    @media (prefers-reduced-motion: reduce) {
      .msg, #avatar svg, #avatar.sprechen, .augen, #welle span, .tippt span { animation: none !important; }
    }
  </style>
</head>
<body>
  <!-- Alles in EINER Karte: Kopf, Figur, Verlauf, Eingabe. -->
  <main id="panel">
  <div id="kopfleiste">
    <span class="name" id="avatar-name">KI-Agent</span>
    <span class="status">online</span>
    <button id="stimme" aria-label="Vorlesen einschalten" aria-pressed="false" title="Antworten vorlesen">
      <svg id="stimme-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/></svg>
    </button>
    <!-- Vollbild: erst hier wird zweispaltig umgeschaltet (Figur links, Chat
         rechts). Ausserhalb des Vollbilds bleibt das Layout unveraendert. -->
    <button id="vollbild" aria-label="Vollbild einschalten" aria-pressed="false" title="Vollbild">
      <svg id="vollbild-auf" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 3H5a2 2 0 0 0-2 2v3"/><path d="M21 8V5a2 2 0 0 0-2-2h-3"/><path d="M3 16v3a2 2 0 0 0 2 2h3"/><path d="M16 21h3a2 2 0 0 0 2-2v-3"/></svg>
      <svg id="vollbild-zu" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" hidden><path d="M8 3v3a2 2 0 0 1-2 2H3"/><path d="M21 8h-3a2 2 0 0 1-2-2V3"/><path d="M3 16h3a2 2 0 0 1 2 2v3"/><path d="M16 21v-3a2 2 0 0 1 2-2h3"/></svg>
    </button>
  </div>

  <!-- Charakter-Bühne: die Figur ist die Hauptperson, zeigt aber keinen Text
       mehr (der steht im Verlauf darunter) — nur Reaktion + Klappmaul beim
       Vorlesen. #avatar = Platzhalter-SVG (Fallback), #avatar-img = generiertes
       Bild. -->
  <div id="buehne">
    <div id="avatar">
      <svg viewBox="0 0 120 120" xmlns="http://www.w3.org/2000/svg">
        <ellipse class="koerper" cx="60" cy="62" rx="44" ry="42" fill="var(--farbe)" />
        <ellipse cx="60" cy="74" rx="26" ry="22" fill="var(--akzent)" opacity="0.5" />
        <circle class="wange" cx="38" cy="66" r="7" fill="#ff8a8a" />
        <circle class="wange" cx="82" cy="66" r="7" fill="#ff8a8a" />
        <g class="augen" fill="#1b2a22">
          <circle cx="47" cy="55" r="6" />
          <circle cx="73" cy="55" r="6" />
          <circle cx="49" cy="53" r="2" fill="#fff" />
          <circle cx="75" cy="53" r="2" fill="#fff" />
        </g>
        <ellipse class="mund" cx="60" cy="73" rx="9" ry="5" fill="#1b2a22" />
      </svg>
      <img id="avatar-img" alt="Charakter" />
      <div id="initial" aria-hidden="true"></div>
    </div>
    <div id="welle" aria-hidden="true"><span></span><span></span><span></span><span></span><span></span></div>
  </div>

  <div id="chat"></div>
  <form id="form">
    <input id="input" placeholder="Frag mich etwas…" autocomplete="off" />
    <button id="mic" type="button" class="ki-mic" aria-label="Spracheingabe" title="Sprechen"><svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2a3 3 0 0 0-3 3v6a3 3 0 0 0 6 0V5a3 3 0 0 0-3-3z"/><path d="M5 10v1a7 7 0 0 0 14 0v-1"/><line x1="12" y1="18" x2="12" y2="22"/></svg></button>
    <button id="send" type="submit">Senden</button>
  </form>
  </main>
  <p id="fusszeile"><a id="erstellen-link" href="dashboard.html">Charakter im Dashboard bearbeiten →</a></p>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.110.0"></script>
  <script src="lib/supabase-config.js"></script>
  <script src="lib/auth.js"></script>
  <script src="lib/store.js"></script>
  <script src="lib/chat-ui.js"></script>
  <script>
    const chat = document.getElementById("chat");
    const form = document.getElementById("form");
    const input = document.getElementById("input");
    const send = document.getElementById("send");
    const avatar = document.getElementById("avatar");
    const avatarImg = document.getElementById("avatar-img");
    const avatarName = document.getElementById("avatar-name");
    const welle = document.getElementById("welle");
    const stimmeBtn = document.getElementById("stimme");

    // Welche Firma dieser Agent vertritt.
    // Standard: salbei. Andere Firma testen: "?firma=nordlicht" an die URL hängen.
    const FIRMA_ID = new URLSearchParams(location.search).get("firma") || "salbei";

    // Generierte Charakter-Bilder pro Zustand (Phase 1). null = noch keine -> SVG-Fallback.
    // Erwartet später z.B. { idle: "<url>", denken: "<url>", sprechen: "<url>", verlegen: "<url>" }
    let bilder = null;

    // Gesetzt, wenn diese Firma ein Onboarding-Entwurf ist -> wird an den Chat mitgesendet.
    let firmaConfig = null;

    // --- Charakter-Steuerung ---
    // Bild wenn vorhanden, sonst Platzhalter-SVG. Die Zustands-Klasse wird immer
    // gesetzt, damit das Sprech-Wippen auch im Bild-Modus greift. Beim Sprechen
    // wird zwischen "Mund zu" und "Mund offen" gewechselt (Klappmaul), sofern das
    // sprechen_offen-Bild existiert.
    let flapTimer;
    function stopFlap() { clearInterval(flapTimer); flapTimer = null; }
    let revertTimer;
    function setCharakter(zustand, dauer) {
      clearTimeout(revertTimer);
      stopFlap();
      avatar.className = zustand === "idle" ? "" : zustand;
      const bildKey = zustand === "idle" ? "idle" : zustand;
      const svg = avatar.querySelector("svg");
      const initialEl = document.getElementById("initial");
      const nm = (avatarName.textContent || FIRMA_ID || "•").trim();
      initialEl.textContent = (nm.charAt(0) || "•").toUpperCase();
      if (bilder && (bilder[bildKey] || bilder.idle)) {
        // Generiertes Maskottchen. Lädt ein Bild nicht -> Initial statt leer.
        avatarImg.onerror = () => { avatarImg.style.display = "none"; initialEl.style.display = "flex"; };
        avatarImg.src = bilder[bildKey] || bilder.idle;
        avatarImg.style.display = "block";
        svg.style.display = "none";
        initialEl.style.display = "none";
        if (zustand === "sprechen" && bilder.sprechen_offen && bilder.sprechen) {
          let auf = false;
          flapTimer = setInterval(() => {
            auf = !auf;
            avatarImg.src = auf ? bilder.sprechen_offen : bilder.sprechen;
          }, 180);
        }
      } else {
        // Noch kein Charakterbild: Initial in Markenfarbe statt Platzhalter-SVG.
        avatarImg.style.display = "none";
        svg.style.display = "none";
        initialEl.style.display = "flex";
      }
      if (dauer) revertTimer = setTimeout(() => setCharakter("idle"), dauer);
    }

    // --- Stimme: liest die Antwort laut vor (Browser-TTS), standardmässig AUS ---
    const TTS = ("speechSynthesis" in window);
    let stimmeAn = false;
    try { stimmeAn = localStorage.getItem("kiagent-stimme") === "1"; } catch (e) {}
    if (!TTS) stimmeBtn.style.display = "none";
    function malStimmeKnopf() {
      stimmeBtn.classList.toggle("an", stimmeAn);
      stimmeBtn.setAttribute("aria-pressed", String(stimmeAn));
      stimmeBtn.setAttribute("aria-label", stimmeAn ? "Vorlesen ausschalten" : "Vorlesen einschalten");
      document.getElementById("stimme-icon").innerHTML = stimmeAn
        ? '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M18.5 5.5a9 9 0 0 1 0 13"/>'
        : '<polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"/><line x1="23" y1="9" x2="17" y2="15"/><line x1="17" y1="9" x2="23" y2="15"/>';
    }
    malStimmeKnopf();
    stimmeBtn.addEventListener("click", () => {
      stimmeAn = !stimmeAn;
      try { localStorage.setItem("kiagent-stimme", stimmeAn ? "1" : "0"); } catch (e) {}
      malStimmeKnopf();
      if (!stimmeAn && TTS) { window.speechSynthesis.cancel(); welle.style.display = "none"; }
    });
    let sprechTimer;
    function beendeSprechen() { clearTimeout(sprechTimer); welle.style.display = "none"; setCharakter("idle"); }
    function liesVor(text) {
      if (!stimmeAn || !TTS || !text) return;
      try {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance(text);
        u.lang = "de-DE";
        setCharakter("sprechen");
        welle.style.display = "flex";
        u.onend = beendeSprechen;
        u.onerror = beendeSprechen;
        clearTimeout(sprechTimer);
        sprechTimer = setTimeout(beendeSprechen, Math.min(30000, 2500 + text.length * 90));
        window.speechSynthesis.speak(u);
      } catch (e) { beendeSprechen(); }
    }

    // Platz-Regler: Die Figur gibt in Stufen Platz ab, sobald der Verlauf ihn
    // braucht, und bleibt dabei bis zuletzt eine erkennbare Figur (Untergrenze
    // ist die letzte Stufe), damit das Gespraechsgefuehl nicht kippt.
    const figur = ChatUI.figurRegler({
      buehne: document.getElementById("buehne"),
      chat,
      // Im Vollbild hat die Figur eine eigene Spalte — dort nie schrumpfen.
      aktiv: () => !document.body.classList.contains("vollbild"),
      stufen: [
        "min(300px, 62vw, 36vh)",
        "min(240px, 52vw, 30vh)",
        "min(190px, 44vw, 24vh)",
        "min(150px, 36vw, 19vh)",
      ],
    });

    // Gemeinsame Chat-Logik aus lib/chat-ui.js. Die Bühne (nur noch Stimme/
    // Reaktion, keine Sprechblase mehr) wird über onFrage/onAntwort gesteuert;
    // der Verlauf (#chat) füllt sich weiter und trägt jetzt auch die Vorschlaege.
    const ui = ChatUI.starten({
      chat, form, input, send,
      firmaId: FIRMA_ID,
      nachNachricht: () => figur.pruefe(),
      avatar: setCharakter,
      holeFirmaConfig: () => firmaConfig,
      onAntwort: (text) => { liesVor(text); },
    });
    ChatUI.spracheAn(document.getElementById("mic"), input);

    // --- Vollbild -----------------------------------------------------------
    // Nur im Vollbild wird zweispaltig umgeschaltet. Dort hat die Figur eine
    // eigene Spalte und soll NIE schrumpfen — der Platz-Regler wird deshalb
    // stillgelegt und seine bereits gesetzte Groesse zurueckgenommen, damit die
    // CSS-Groesse der Vollbild-Spalte greift. Beim Verlassen laeuft er weiter.
    const vollbildBtn = document.getElementById("vollbild");
    const iconAuf = document.getElementById("vollbild-auf");
    const iconZu = document.getElementById("vollbild-zu");
    // Ohne Fullscreen-API (aeltere Browser, iOS-Safari im iframe) macht der
    // Knopf nichts Sinnvolles — dann lieber gar nicht anbieten.
    if (!document.documentElement.requestFullscreen) {
      vollbildBtn.style.display = "none";
    }
    vollbildBtn.addEventListener("click", () => {
      if (document.fullscreenElement) document.exitFullscreen();
      else document.documentElement.requestFullscreen().catch(() => {});
    });
    document.addEventListener("fullscreenchange", () => {
      const an = !!document.fullscreenElement;
      document.body.classList.toggle("vollbild", an);
      iconAuf.hidden = an; iconZu.hidden = !an;
      vollbildBtn.setAttribute("aria-pressed", String(an));
      vollbildBtn.setAttribute("aria-label", an ? "Vollbild verlassen" : "Vollbild einschalten");
      // Stufen-Groesse zuruecknehmen: im Vollbild gilt die Spaltengroesse,
      // danach darf der Regler wieder frisch entscheiden.
      figur.zuruecksetzen();
      if (!an) figur.pruefe();
    });

    function setzeAussehen(c) {
      if (c.farbe) { avatar.style.setProperty("--farbe", c.farbe); document.documentElement.style.setProperty("--farbe", c.farbe); }
      if (c.akzent) { avatar.style.setProperty("--akzent", c.akzent); document.documentElement.style.setProperty("--akzent", c.akzent); }
      if (c.bilder) bilder = c.bilder;
    }

    // Beim Laden: Firma holen, Aussehen setzen, begrüssen.
    //
    // EINE Quelle: /firma liefert genau das, was auch jeder Besucher im Widget
    // sieht — aus derselben Datenbankzeile, die Onboarding und Dashboard
    // schreiben. Frueher las diese Seite zusaetzlich per Store.ladeFirma direkt
    // aus der DB und zog sich obendrein Charakterbilder aus dem localStorage;
    // dadurch sah der Besitzer hier etwas anderes als seine Besucher.
    // Store.ladeFirma bleibt nur noch als Notnagel fuer den Simulationsmodus
    // (kein Supabase konfiguriert -> die Function kennt die Firma nicht).
    //
    // Cache-Bust: Dieser Test-Chat soll Aenderungen aus dem Dashboard sofort
    // zeigen, nicht erst nach Ablauf des HTTP-Caches.
    async function start() {
      let quelle = null;
      try {
        const res = await fetch("/.netlify/functions/firma?id=" + encodeURIComponent(FIRMA_ID) + "&t=" + Date.now());
        if (res.ok) {
          quelle = await res.json();
          setzeAussehen(quelle.charakter || {});
          if (quelle.persona) avatarName.textContent = quelle.persona;
          else if (quelle.name) avatarName.textContent = quelle.name;
        }
      } catch (e) { /* Aussehen ist nicht kritisch — Chat funktioniert trotzdem */ }

      if (!quelle && window.Store) {
        // Simulationsmodus: Die Firma liegt nur lokal im Browser. Dann muss die
        // Config mitgesendet werden, sonst kennt der Server sie nicht.
        const lokal = await Store.ladeFirma(FIRMA_ID);
        if (lokal) {
          quelle = lokal;
          firmaConfig = lokal;
          setzeAussehen(lokal.charakter || {});
          avatarName.textContent = (lokal.persona && lokal.persona.name) || lokal.name || "";
        }
      }

      const link = document.getElementById("erstellen-link");
      if (link) link.href = "dashboard.html?firma=" + encodeURIComponent(FIRMA_ID);

      setCharakter("freuen", 700);
      const gruss = "Hallo! Schön, dass du da bist. Wie kann ich dir helfen?";
      ui.addBubble(gruss, "bot");
      ui.zeigeVorschlaege(ChatUI.vorschlaegeAus(quelle));
    }

    start();
  </script>
</body>
</html>
